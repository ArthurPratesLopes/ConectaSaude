<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Print-Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="menu">
    <a href="../index.html" class="logo">
      <img src="../img/logo-printbridge.png" alt="Logo do Print-Bridge">
      <span>Print-Bridge</span>
    </a>
  </header>

  <main class="cadastro">
    <form class="form-cadastro" id="formCadastro">
      <h1>Criar conta</h1>

      <fieldset class="perfis">
        <legend>Você é</legend>
        <label class="perfil">
          <input type="radio" name="perfil" value="aacd" required>
          <span>AACD</span>
        </label>
        <label class="perfil">
          <input type="radio" name="perfil" value="fablab">
          <span>Laboratório (FabLab)</span>
        </label>
      </fieldset>

      <label for="nome" id="rotuloNome">Nome da instituição</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail institucional</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" minlength="8" required>

      <label for="confirmar">Confirmar senha</label>
      <input type="password" id="confirmar" name="confirmar" required>

      <p class="erro" id="erro" role="alert"></p>

      <button type="submit" class="botao">Cadastrar</button>

      <p class="alternativa">Já tem conta? <a href="entrar.html">Entrar</a></p>

    </form>
  </main>

  <script src="../js/perfil.js"></script>
  <script src="../js/cadastro.js"></script>
</body>

</html>
