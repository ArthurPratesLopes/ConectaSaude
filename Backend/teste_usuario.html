<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Conecta Saúde - teste de autenticação</title>
  <style>
    body { font-family: sans-serif; margin: 30px; display: flex; gap: 20px; }
    .cartao { background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 8px; width: 300px; }
    input, select, button { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { background: #0070f3; color: white; border: none; cursor: pointer; font-weight: bold; }
    .resultado { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="cartao">
    <h3>📝 Testar Cadastro</h3>
    <input type="text" id="cad-nome" placeholder="Nome da Instituição">
    <input type="email" id="cad-email" placeholder="E-mail">
    <input type="password" id="cad-senha" placeholder="Senha">
    <select id="cad-perfil">
      <option value="cliente">Cliente (AACD)</option>
      <option value="fornecedor">Fornecedor (FabLab)</option>
    </select>
    <input type="text" id="cad-cidade" placeholder="Cidade">
    <input type="text" id="cad-estado" placeholder="Estado (ex.: SP)">
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="resultado-cadastro" class="resultado"></div>
  </div>

  <!-- FORMULÁRIO DE LOGIN -->
  <div class="cartao">
    <h3>🔑 Testar Login</h3>
    <input type="email" id="login-email" placeholder="E-mail">
    <input type="password" id="login-senha" placeholder="Senha">
    <button onclick="logar()">Entrar</button>
    <div id="resultado-login" class="resultado"></div>
  </div>

  <script>
    const ENDERECO_API = 'http://localhost:5000/api/auth';

    async function cadastrar() {
      const body = {
        nomeInstituicao: document.getElementById('cad-nome').value,
        email: document.getElementById('cad-email').value,
        senha: document.getElementById('cad-senha').value,
        perfil: document.getElementById('cad-perfil').value,
        cidade: document.getElementById('cad-cidade').value,
        estado: document.getElementById('cad-estado').value
      };

      const resposta = await fetch(`${ENDERECO_API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const dados = await resposta.json();
      const elemento = document.getElementById('resultado-cadastro');
      elemento.style.background = resposta.ok ? '#d4edda' : '#f8d7da';
      elemento.innerHTML = resposta.ok ? `✅ Criado! ID: ${dados.usuario.id}` : `❌ ${dados.erro}`;
    }

    async function logar() {
      const body = {
        email: document.getElementById('login-email').value,
        senha: document.getElementById('login-senha').value
      };

      const resposta = await fetch(`${ENDERECO_API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const dados = await resposta.json();
      const elemento = document.getElementById('resultado-login');
      elemento.style.background = resposta.ok ? '#d4edda' : '#f8d7da';
      elemento.innerHTML = resposta.ok ? `🎉 Bem-vindo, ${dados.usuario.nomeInstituicao}!` : `❌ ${dados.erro}`;
    }
  </script>
</body>
</html>
