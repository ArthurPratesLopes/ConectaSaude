<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta Saúde - Teste de envio e visualizador 3D</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .painel {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #008C91;
    }
    input, button {
      margin-top: 10px;
      padding: 10px;
      font-size: 1rem;
    }
    button {
      background-color: #008C91;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #007377;
    }
    #situacao {
      margin-top: 15px;
      font-weight: bold;
    }
    #visualizador {
      width: 100%;
      height: 400px;
      background-color: #e2e8f0;
      margin-top: 20px;
      border-radius: 4px;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="painel">
    <h2>🖨️ Teste de envio e visualizador 3D (.stl)</h2>
    <p>Selecione um arquivo .stl para enviar ao servidor e renderizar na tela:</p>
    
    <input type="file" id="entrada-stl" accept=".stl"><br>
    <button onclick="enviarEVisualizar()">Enviar e Visualizar</button>

    <div id="situacao"></div>
    <div id="visualizador"></div>
  </div>

  <!-- Importa a biblioteca Three.js e o carregador STL externo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let cena, camera, renderizador, controles;

    function iniciarVisualizador() {
      const painel = document.getElementById('visualizador');
      if (renderizador) {
        painel.innerHTML = ''; // Limpa anterior se houver
      }

      // Cena
      cena = new THREE.Scene();
      cena.background = new THREE.Color(0xe2e8f0);

      // Câmera
      camera = new THREE.PerspectiveCamera(45, painel.clientWidth / painel.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 200);

      // Renderizador
      renderizador = new THREE.WebGLRenderer({ antialias: true });
      renderizador.setSize(painel.clientWidth, painel.clientHeight);
      painel.appendChild(renderizador.domElement);

      // Controles de órbita (girar com o mouse)
      controles = new THREE.OrbitControls(camera, renderizador.domElement);
      controles.enableDamping = true;

      // Luzes
      const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.6);
      cena.add(luzAmbiente);

      const luzDirecional = new THREE.DirectionalLight(0xffffff, 0.8);
      luzDirecional.position.set(1, 1, 1).normalize();
      cena.add(luzDirecional);

      // Loop de animação
      function animar() {
        requestAnimationFrame(animar);
        controles.update();
        renderizador.render(cena, camera);
      }
      animar();
    }

    async function enviarEVisualizar() {
      const entradaArquivo = document.getElementById('entrada-stl');
      const elementoSituacao = document.getElementById('situacao');

      if (entradaArquivo.files.length === 0) {
        elementoSituacao.style.color = 'red';
        elementoSituacao.innerText = 'Por favor, selecione um arquivo .stl primeiro!';
        return;
      }

      const arquivo = entradaArquivo.files[0];
      const dadosFormulario = new FormData();
      dadosFormulario.append('arquivoStl', arquivo);

      elementoSituacao.style.color = '#008C91';
      elementoSituacao.innerText = 'Enviando arquivo para o servidor...';

      try {
        const resposta = await fetch('http://localhost:5000/api/upload-stl', {
          method: 'POST',
          body: dadosFormulario
        });

        const dados = await resposta.json();

        if (resposta.ok && dados.sucesso) {
          elementoSituacao.style.color = 'green';
          elementoSituacao.innerText = `Sucesso! Carregando visualização 3D...`;
          
          // Inicializa o visualizador e carrega o arquivo pela URL pública gerada
          iniciarVisualizador();
          carregarModelo3D(dados.url);
        } else {
          elementoSituacao.style.color = 'red';
          elementoSituacao.innerText = `Erro: ${dados.erro || 'Falha no envio'}`;
        }
      } catch (erro) {
        console.error(erro);
        elementoSituacao.style.color = 'red';
        elementoSituacao.innerText = 'Erro de conexão com o servidor.';
      }
    }

    function carregarModelo3D(url) {
      const carregador = new THREE.STLLoader();
      carregador.load(url, function (geometria) {
        const material = new THREE.MeshStandardMaterial({
          color: 0x008C91, 
          roughness: 0.4, 
          metalness: 0.2 
        });
        const malha = new THREE.Mesh(geometria, material);

        // Centraliza a geometria na tela
        geometria.computeBoundingBox();
        const centro = new THREE.Vector3();
        geometria.boundingBox.getCenter(centro);
        geometria.center();

        cena.add(malha);

        // Ajusta a câmera com base no tamanho do objeto
        const dimensoes = new THREE.Vector3();
        geometria.boundingBox.getSize(dimensoes);
        const dimensaoMaxima = Math.max(dimensoes.x, dimensoes.y, dimensoes.z);
        camera.position.set(0, 0, dimensaoMaxima * 2.5);
        controles.update();

        document.getElementById('situacao').innerText += ' — Renderizado com sucesso! 🚀';
      }, (progresso) => {
        console.log((progresso.loaded / progresso.total * 100) + '% carregado');
      }, (erro) => {
        console.error(erro);
        document.getElementById('situacao').style.color = 'red';
        document.getElementById('situacao').innerText = 'Erro ao carregar o modelo 3D.';
      });
    }
  </script>
</body>
</html>
